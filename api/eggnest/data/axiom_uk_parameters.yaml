# Statutory values supplied as engine inputs for the few rules whose
# amounts are not yet parameterized inside rulespec-uk (each module's
# remaining `#input.*` slots). Everything rulespec-uk has parameterized —
# rate limits (FA 2021/FA 2023 imports), the dividend nil rate (ITA
# s.13A), savings allowances (ss.12-12B), NI percentages (SSCBA s.8) — is
# read from the encodings, not from this file.
#
# Every value below carries its legal source and is cross-checked against
# policyengine-uk-compiled in tests/test_axiom_uk.py. Remove entries as
# rulespec-uk parameterizes them.

income_tax_rates:
  basic_rate:
    value: 0.20
    source: "Income Tax Act 2007 s.6(2)"
    url: https://www.legislation.gov.uk/ukpga/2007/3/section/6
  higher_rate:
    value: 0.40
    source: "Income Tax Act 2007 s.6(2)"
    url: https://www.legislation.gov.uk/ukpga/2007/3/section/6
  additional_rate:
    value: 0.45
    source: "Income Tax Act 2007 s.6(2)"
    url: https://www.legislation.gov.uk/ukpga/2007/3/section/6

# The rulespec-uk ITA s.8 encoding currently dates the Finance Act 2026
# dividend rates (10.75%/35.75%) from 2024-04-06, so these 2025/26
# statutory rates stay here until the upstream effective-dating is
# corrected (issue filed against rulespec-uk).
dividend_tax:
  dividend_ordinary_rate:
    value: 0.0875
    source: "Income Tax Act 2007 s.8(1), rate for 2025/26"
    url: https://www.legislation.gov.uk/ukpga/2007/3/section/8
  dividend_upper_rate:
    value: 0.3375
    source: "Income Tax Act 2007 s.8(2), rate for 2025/26"
    url: https://www.legislation.gov.uk/ukpga/2007/3/section/8
  dividend_additional_rate:
    value: 0.3935
    source: "Income Tax Act 2007 s.8(3)"
    url: https://www.legislation.gov.uk/ukpga/2007/3/section/8

savings:
  starting_rate_for_savings:
    value: 0.0
    source: "Income Tax Act 2007 s.7 (starting rate for savings is 0%)"
    url: https://www.legislation.gov.uk/ukpga/2007/3/section/7

national_insurance:
  # Weekly equivalents of the annual thresholds, kept here as an explicit
  # annual-equivalence convention: the statutory weekly primary threshold is
  # £242 (SI 2001/1004 reg 10, encoded in rulespec-uk), but this simulator
  # models annual income, so £12,570 / 52 keeps the annual calculation exact.
  weekly_primary_threshold:
    value: 241.73
    source: "SSCBA 1992 s.5; SI 2001/1004 reg 10 (annual £12,570 / 52)"
    url: https://www.legislation.gov.uk/uksi/2001/1004/regulation/10
  weekly_upper_earnings_limit:
    value: 967.0
    source: "SSCBA 1992 s.5; SI 2001/1004 reg 10 (annual £50,270 / 52)"
    url: https://www.legislation.gov.uk/uksi/2001/1004/regulation/10
  state_pension_age:
    value: 66
    source: "Pensions Act 1995 Sch 4 as amended; SSCBA 1992 s.6(3) exempts earners over pensionable age from primary contributions"
    url: https://www.legislation.gov.uk/ukpga/1992/4/section/6
