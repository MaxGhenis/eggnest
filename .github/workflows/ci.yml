name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # uv sync gives `uv run` one project venv built from uv.lock with all
      # extras; mixing a --system install with uv run's own venv left tools
      # resolving from two different environments.
      - name: Install dependencies
        run: uv sync --all-extras

      # The Modal image installs requirements-modal.txt, so it must be the
      # runtime part of uv.lock that these tests run against. (Extras such as
      # dev are left out of `uv export` unless requested.)
      - name: Check Modal requirements match uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --no-header -o /tmp/requirements-modal.txt
          diff -u requirements-modal.txt /tmp/requirements-modal.txt

      - name: Run linting
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Show runner resources
        run: nproc && free -h

      # PolicyEngine memory accumulates over a pytest session and one full
      # run exhausts the 16GB runner (see the [mem] probe history). The
      # US simulator files are the heavy ones: on policyengine-us 2.15.16 a
      # single test there peaks near 9GB, so two xdist workers holding two
      # of them overflow the runner. They each run alone, one process per
      # file; the rest run as two sequential shards (memory resets between
      # shards) with two xdist workers inside each.
      - name: Run tests
        run: |
          (while true; do free -m | awk '/Mem:/{printf "[mem] used=%dMiB avail=%dMiB\n",$3,$7}'; sleep 20; done) &
          MEMMON=$!
          trap 'kill $MEMMON' EXIT
          HEAVY=( tests/test_simulation.py tests/test_simulation_correctness.py tests/test_simulation_holdings.py )
          FILES=( $(ls tests/test_*.py | sort | grep -vxF -f <(printf '%s\n' "${HEAVY[@]}")) )
          TOTAL=${#FILES[@]}
          HALF=$(( (TOTAL + 1) / 2 ))
          uv run pytest "${FILES[@]:0:HALF}" -n 2 --dist loadfile --tb=short
          uv run pytest "${FILES[@]:HALF}" -n 2 --dist loadfile --tb=short
          for file in "${HEAVY[@]}"; do
            uv run pytest "$file" --tb=short
          done

  # test-api runs on Python 3.14, but the Modal image (api/modal_app.py) runs
  # 3.11. Install the same lock on 3.11, import the app and run the household
  # tests there.
  test-api-py311:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: api
    env:
      UV_PYTHON: '3.11'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Import the app
        run: uv run python -c "import main"

      - name: Run household tests
        run: >-
          uv run pytest tests/test_household_net_income.py
          tests/test_household_calculator.py
          tests/test_core_us_household_resources.py
          tests/test_agent_household_surfaces.py
          -n 2 --dist loadfile --tb=short

  test-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linting
        run: bun run lint

      - name: Run tests
        run: bun run test:run

      - name: Build
        run: bun run build
