name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # uv sync gives `uv run` one project venv built from uv.lock with all
      # extras; mixing a --system install with uv run's own venv left tools
      # resolving from two different environments.
      - name: Install dependencies
        run: uv sync --all-extras

      # The Modal image installs requirements-modal.txt, so it must be the
      # runtime part of uv.lock that these tests run against. (`uv export`
      # leaves out extras such as dev unless asked.) The check compares
      # pin lines only, since uv's "# via" comments can change between uv
      # versions.
      - name: Check Modal requirements match uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --no-header -o /tmp/requirements-modal.txt
          diff -u <(grep -v '^ *#' requirements-modal.txt) <(grep -v '^ *#' /tmp/requirements-modal.txt)

      - name: Run linting
        run: |
          uv run ruff check .
          uv run black --check .

      # The Axiom rules engine and rulespec-uk, pinned, so the Axiom backend
      # and Pension Credit screen tests run instead of skipping. The engine
      # needs the rulespec checkout in a real directory named rulespec-uk,
      # passed by its canonical path.
      - name: Install Axiom rules engine and rulespec-uk (pinned)
        working-directory: ${{ runner.temp }}
        env:
          AXIOM_ENGINE_TAG: v0.2.2
          AXIOM_ENGINE_SHA256: 76565685230d64edf33e4205f01f77c57ef341ba2d3cf75dc967fc12c883f1f4
          RULESPEC_UK_SHA: 932390fa793d473cfdb0ff1b52a0b038cabeda41
        run: |
          set -euo pipefail
          asset=axiom-rules-engine-x86_64-unknown-linux-gnu.tar.xz
          curl -fsSL -o "$asset" \
            "https://github.com/TheAxiomFoundation/axiom-rules-engine/releases/download/${AXIOM_ENGINE_TAG}/${asset}"
          echo "${AXIOM_ENGINE_SHA256}  ${asset}" | sha256sum --check
          tar -xJf "$asset"
          bin="$(realpath axiom-rules-engine-x86_64-unknown-linux-gnu/axiom-rules-engine)"
          "$bin" capabilities
          mkdir rulespec-uk
          cd rulespec-uk
          git init -q
          git remote add origin https://github.com/TheAxiomFoundation/rulespec-uk.git
          git fetch -q --depth 1 origin "$RULESPEC_UK_SHA"
          git checkout -q FETCH_HEAD
          root="$(pwd -P)"
          "$bin" compile --program "$root/uk/statutes/ukpga/2007/3/10.yaml" \
            --rulespec-root "$root" --output /dev/null
          echo "EGGNEST_AXIOM_ENGINE_BIN=$bin" >> "$GITHUB_ENV"
          echo "EGGNEST_RULESPEC_UK_ROOT=$root" >> "$GITHUB_ENV"
          echo "EGGNEST_REQUIRE_AXIOM=1" >> "$GITHUB_ENV"

      - name: Show runner resources
        run: nproc && free -h

      # PolicyEngine memory accumulates over a pytest session and one full
      # run exhausts the 16GB runner (see the [mem] probe history). The
      # US simulator files are the heavy ones. On run 40183064222
      # (policyengine-us 2.15.16), the runner's used memory peaked at 9,659,
      # 7,243 and 12,460 MiB while test_simulation.py,
      # test_simulation_correctness.py and test_simulation_holdings.py each
      # ran alone, from 1,045 to 1,465 MiB idle, on a runner with 15,989 MiB.
      # Adding those up, either pair with the holdings file would exceed the
      # runner and the other pair would nearly fill it. So each runs alone,
      # one process per file; the rest run as two sequential shards (memory
      # resets between shards) with two xdist workers inside each.
      - name: Run tests
        run: |
          (while true; do free -m | awk '/Mem:/{printf "[mem] used=%dMiB avail=%dMiB\n",$3,$7}'; sleep 20; done) &
          MEMMON=$!
          trap 'kill $MEMMON 2>/dev/null || true' EXIT
          HEAVY=( tests/test_simulation.py tests/test_simulation_correctness.py tests/test_simulation_holdings.py )
          FILES=( $(ls tests/test_*.py | sort | grep -vxF -f <(printf '%s\n' "${HEAVY[@]}")) )
          TOTAL=${#FILES[@]}
          HALF=$(( (TOTAL + 1) / 2 ))
          uv run pytest "${FILES[@]:0:HALF}" -n 2 --dist loadfile --tb=short
          uv run pytest "${FILES[@]:HALF}" -n 2 --dist loadfile --tb=short
          for file in "${HEAVY[@]}"; do
            uv run pytest "$file" --tb=short
          done

  # test-api runs on Python 3.14, but the Modal image (api/modal_app.py) runs
  # 3.11. Install the same lock on 3.11, import the app and run the household,
  # UK and job-store tests there. test-api installs the Axiom engine and runs
  # the Axiom tests; this job does not install it, as the Modal image does not.
  # The image installs no extras, so this job imports the app before it
  # installs the dev extra, and optional imports such as supabase's take the
  # same branch they take in the image.
  test-api-py311:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: api
    env:
      UV_PYTHON: '3.11'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install runtime dependencies (no extras, like the image)
        run: uv sync --frozen

      - name: Import the app
        run: uv run --frozen python -c "import main"

      - name: Install the dev extra for the tests
        run: uv sync --frozen --extra dev

      - name: Run household, UK and job-store tests
        run: >-
          uv run --frozen pytest tests/test_household_net_income.py
          tests/test_household_calculator.py
          tests/test_core_us_household_resources.py
          tests/test_agent_household_surfaces.py
          tests/test_simulation_uk.py
          tests/test_core_uk_retirement.py
          tests/test_modal_app.py
          tests/test_simulation_jobs.py
          -n 2 --dist loadfile --tb=short

  test-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linting
        run: bun run lint

      - name: Run tests
        run: bun run test:run

      - name: Build
        run: bun run build
