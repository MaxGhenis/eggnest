name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # uv sync gives `uv run` one project venv built from uv.lock with all
      # extras; mixing a --system install with uv run's own venv left tools
      # resolving from two different environments.
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run linting
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Show runner resources
        run: nproc && free -h

      # PolicyEngine memory accumulates over a pytest session and one full
      # run exhausts the 16GB runner (see the [mem] probe history). Running
      # the suite as three sequential shards resets memory between shards
      # while keeping two xdist workers inside each.
      - name: Run tests
        run: |
          (while true; do free -m | awk '/Mem:/{printf "[mem] used=%dMiB avail=%dMiB\n",$3,$7}'; sleep 20; done) &
          MEMMON=$!
          FILES=( $(ls tests/test_*.py | sort) )
          TOTAL=${#FILES[@]}
          THIRD=$(( (TOTAL + 2) / 3 ))
          uv run pytest "${FILES[@]:0:THIRD}" -n 2 --dist loadfile --tb=short
          uv run pytest "${FILES[@]:THIRD:THIRD}" -n 2 --dist loadfile --tb=short
          uv run pytest "${FILES[@]:$((2 * THIRD))}" -n 2 --dist loadfile --tb=short
          kill $MEMMON

  test-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linting
        run: bun run lint

      - name: Run tests
        run: bun run test:run

      - name: Build
        run: bun run build
