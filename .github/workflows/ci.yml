name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # uv sync gives `uv run` one project venv built from uv.lock with all
      # extras; mixing a --system install with uv run's own venv left tools
      # resolving from two different environments.
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run linting
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Show runner resources
        run: nproc && free -h

      # Two workers with per-file distribution: each PolicyEngine engine
      # loads in as few workers as possible. The background probe prints
      # memory every 20s so a runner-killed step leaves a diagnosis behind.
      - name: Run tests
        run: |
          (while true; do free -m | awk '/Mem:/{printf "[mem] used=%dMiB avail=%dMiB\n",$3,$7}'; sleep 20; done) &
          MEMMON=$!
          uv run pytest tests/ -n 2 --dist loadfile --tb=short
          kill $MEMMON

  test-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linting
        run: bun run lint

      - name: Run tests
        run: bun run test:run

      - name: Build
        run: bun run build
