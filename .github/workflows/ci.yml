name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: api
    env:
      # Match the Modal image (api/modal_app.py).
      UV_PYTHON: '3.11'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # uv sync gives `uv run` one project venv built from uv.lock with all
      # extras (the dev extra carries pytest, Hypothesis and pytest-xdist).
      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # The Modal image installs requirements-modal.txt, so it must be the
      # runtime part of uv.lock that these tests run against. (Extras such as
      # dev are left out of `uv export` unless requested.)
      - name: Check Modal requirements match uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --no-header -o /tmp/requirements-modal.txt
          diff -u requirements-modal.txt /tmp/requirements-modal.txt

      - name: Run linting
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Show runner resources
        run: nproc && free -h

      # PolicyEngine memory accumulates over a pytest session and one full
      # run exhausts the 16GB runner (see the [mem] probe history). The US
      # simulator files are the heavy ones. On run 42522911064
      # (policyengine-us 2.15.16), the runner's used memory peaked at 8,538
      # MiB while test_simulation.py ran alone and 10,658 MiB while
      # test_simulation_holdings.py did. When one shard held both files
      # beside the household property tests, it filled the runner and GitHub
      # cancelled the step. So each runs alone, one process per file, and the
      # rest run as two sequential shards (memory resets between shards) with
      # two xdist workers inside each. Same layout as uk-simulator-shipped
      # (9d37f84).
      - name: Run tests
        run: |
          (while true; do free -m | awk '/Mem:/{printf "[mem] used=%dMiB avail=%dMiB\n",$3,$7}'; sleep 20; done) &
          MEMMON=$!
          trap 'kill $MEMMON 2>/dev/null || true' EXIT
          HEAVY=( tests/test_simulation.py tests/test_simulation_holdings.py )
          FILES=( $(ls tests/test_*.py | sort | grep -vxF -f <(printf '%s\n' "${HEAVY[@]}")) )
          TOTAL=${#FILES[@]}
          HALF=$(( (TOTAL + 1) / 2 ))
          uv run pytest "${FILES[@]:0:HALF}" -n 2 --dist loadfile --tb=short
          uv run pytest "${FILES[@]:HALF}" -n 2 --dist loadfile --tb=short
          for file in "${HEAVY[@]}"; do
            uv run pytest "$file" --tb=short
          done

  test-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linting
        run: bun run lint

      - name: Run tests
        run: bun run test:run

      - name: Build
        run: bun run build
